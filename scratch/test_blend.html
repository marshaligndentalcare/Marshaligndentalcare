<!DOCTYPE html>
<html>
<head>
<style>
  body {
    margin: 0;
    background-color: #FAF8F6;
    background-image:
      linear-gradient(rgba(60, 89, 128, 0.05) 1px, transparent 1px),
      linear-gradient(90deg, rgba(60, 89, 128, 0.05) 1px, transparent 1px);
    background-size: 60px 60px;
    display: flex;
    justify-content: center;
    align-items: center;
    min-height: 100vh;
  }
  .wrap {
    position: relative;
    width: 600px;
    height: 520px;
    display: flex;
    align-items: center;
    justify-content: center;
  }
  .glow {
    position: absolute;
    width: 450px;
    height: 450px;
    border-radius: 50%;
    background: radial-gradient(
      circle,
      rgba(168, 184, 194, 0.4) 0%,
      rgba(60, 89, 128, 0.1) 45%,
      transparent 70%
    );
    filter: blur(50px);
    pointer-events: none;
  }
  video {
    width: 100%;
    height: 100%;
    object-fit: contain;
    filter: brightness(1.08) contrast(1.03);
    mask-image: radial-gradient(circle at 50% 50%, black 20%, rgba(0, 0, 0, 0.7) 32%, transparent 46%);
    -webkit-mask-image: radial-gradient(circle at 50% 50%, black 20%, rgba(0, 0, 0, 0.7) 32%, transparent 46%);
  }
</style>
</head>
<body>
<div class="wrap">
  <div class="glow"></div>
  <video src="/animated-video.mp4" autoplay loop muted playsinline></video>
</div>
</body>
</html>
